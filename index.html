<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h2>My Website</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to My Website 👋</h1>
      <p>This website is hosted using GitHub Pages.</p>
      <a href="#" class="btn">Get Started</a>
    </section>
  </main>

  <footer>
    <p>© 2026 My Website. All Rights Reserved.</p>
  </footer>

</body>
</html>
